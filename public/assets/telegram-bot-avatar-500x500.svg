<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181512" />
      <stop offset="50%" stop-color="#241E18" />
      <stop offset="100%" stop-color="#0F0C0A" />
    </linearGradient>
    <linearGradient id="avatarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0D0" />
      <stop offset="50%" stop-color="#E5C178" />
      <stop offset="100%" stop-color="#A67B28" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#avatarBg)" rx="100" />

  <!-- Outer Rings -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#avatarGold)" stroke-width="2" opacity="0.3" />
  <circle cx="250" cy="250" r="208" fill="none" stroke="url(#avatarGold)" stroke-width="1" stroke-dasharray="6 8" opacity="0.4" />
  <circle cx="250" cy="250" r="196" fill="none" stroke="url(#avatarGold)" stroke-width="3" opacity="0.7" />

  <!-- Central Crest Crown / Diamond -->
  <g transform="translate(250, 150)">
    <polygon points="0,-25 18,-5 0,15 -18,-5" fill="url(#avatarGold)" filter="url(#glow)"/>
    <circle cx="0" cy="-35" r="4" fill="url(#avatarGold)" />
  </g>

  <!-- Monogram "TB" -->
  <text x="250" y="295" text-anchor="middle" font-family="'Didot', 'Bodoni MT', 'Cinzel', serif, Georgia" font-size="110" font-weight="700" fill="url(#avatarGold)" letter-spacing="4" filter="url(#glow)">
    TB
  </text>

  <!-- Subtitle Ribbon -->
  <text x="250" y="355" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#EADBC0" letter-spacing="5">
    TIHUT BOUTIQUE
  </text>
  <text x="250" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#9C8C74" letter-spacing="3">
    OFFICIAL BOT
  </text>
</svg>
